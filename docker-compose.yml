services:
  db:
    image: mysql:8.0.41
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nus_team18_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - nus_iss_18_mysql_data:/var/lib/mysql

volumes:
  nus_iss_18_mysql_data:
