name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test
        env:
          VUE_APP_API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL_PROD }}

      - name: Build Vue App
        run: npm run build
        env:
          VUE_APP_API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL_PROD }}