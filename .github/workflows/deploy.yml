name: Build and Deploy Vue App to AWS S3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build Vue App
        run: npm run build
        env:
          VUE_APP_API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL_PROD }}

      - name: Deploy static site to S3 bucket
        run: |
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
        # --delete flag removes files in S3 that are no longer in the build output

      # - name: Invalidate CloudFront Cache
      #   if: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }} # Only run if the secret is set
      #   run: |
      #     aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"